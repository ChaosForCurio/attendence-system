<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="192" height="192">
  <defs>
    <!-- Circular text paths -->
    <path id="topArc" d="M 10,50 A 40,40 0 0,1 90,50" />
    <path id="bottomArc" d="M 15,55 A 38,38 0 0,0 85,55" />
  </defs>

  <!-- Outer black circle -->
  <circle cx="50" cy="50" r="49" fill="#111111" />

  <!-- White ring -->
  <circle cx="50" cy="50" r="36" fill="white" />

  <!-- Inner black circle (globe background) -->
  <circle cx="50" cy="50" r="28" fill="#111111" />

  <!-- Globe wireframe (white lines on black) -->
  <!-- Outer globe circle -->
  <circle cx="50" cy="50" r="22" fill="none" stroke="white" stroke-width="1.2" />

  <!-- Horizontal latitude lines -->
  <ellipse cx="50" cy="50" rx="22" ry="7"  fill="none" stroke="white" stroke-width="0.9" />
  <ellipse cx="50" cy="50" rx="22" ry="14" fill="none" stroke="white" stroke-width="0.9" />

  <!-- Vertical longitude lines (ellipses at angles) -->
  <ellipse cx="50" cy="50" rx="6"  ry="22" fill="none" stroke="white" stroke-width="0.9" />
  <ellipse cx="50" cy="50" rx="12" ry="22" fill="none" stroke="white" stroke-width="0.9" />
  <ellipse cx="50" cy="50" rx="18" ry="22" fill="none" stroke="white" stroke-width="0.9" />
  <!-- Vertical centre line -->
  <line x1="50" y1="28" x2="50" y2="72" stroke="white" stroke-width="0.9" />

  <!-- Diagonal spokes from top-center to globe edge -->
  <line x1="50" y1="28" x2="28" y2="50" stroke="white" stroke-width="0.7" opacity="0.6" />
  <line x1="50" y1="28" x2="72" y2="50" stroke="white" stroke-width="0.7" opacity="0.6" />
  <line x1="50" y1="28" x2="35" y2="68" stroke="white" stroke-width="0.7" opacity="0.5" />
  <line x1="50" y1="28" x2="65" y2="68" stroke="white" stroke-width="0.7" opacity="0.5" />

  <!-- Top curved text: BHAVYACOMPUTERCLASSES -->
  <text font-family="Arial, sans-serif" font-size="6.2" font-weight="bold" fill="white" letter-spacing="0.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">• BHAVYACOMPUTERCLASSES •</textPath>
  </text>

  <!-- Bottom curved text: IGNITE YOUR TECH POTENTIAL -->
  <text font-family="Arial, sans-serif" font-size="5.2" font-weight="bold" fill="#aaaaaa" letter-spacing="0.4">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">IGNITE YOUR TECH POTENTIAL</textPath>
  </text>
</svg>
